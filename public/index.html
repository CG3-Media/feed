<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --black: #0a0a0a;
      --white: #fafafa;
      --gray: #888;
      --know-color: #2563eb;
      --watch-color: #dc2626;
      --listen-color: #16a34a;
      --accent: #fbbf24;
    }
    
    html { scroll-behavior: smooth; }
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--black);
      color: var(--white);
      overflow-x: hidden;
    }
    
    a { color: inherit; text-decoration: none; }
    
    /* Three.js canvas */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
    }
    
    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 24px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(10,10,10,0.9) 0%, transparent 100%);
    }
    
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      cursor: pointer;
    }
    
    .nav-links { display: none; }
    
    /* Menu button - always visible */
    .menu-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--white);
      padding: 10px 20px;
      border-radius: 100px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s;
    }
    
    .menu-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.4);
    }
    
    /* Full page menu */
    .full-menu {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--black);
      z-index: 200;
      padding: 48px;
      overflow-y: auto;
    }
    
    .full-menu.open { display: block; }
    
    .full-menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 64px;
    }
    
    .full-menu-logo {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 900;
    }
    
    .full-menu-close {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--white);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }
    
    .full-menu-close:hover {
      background: rgba(255,255,255,0.1);
    }
    
    .full-menu-section {
      margin-bottom: 48px;
    }
    
    .full-menu-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      opacity: 0.4;
      margin-bottom: 24px;
    }
    
    .full-menu-channels {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .full-menu-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .full-menu-item:hover {
      padding-left: 16px;
      border-color: rgba(255,255,255,0.2);
    }
    
    .full-menu-item .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    
    .full-menu-item-name {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 700;
    }
    
    .full-menu-item-desc {
      font-size: 14px;
      opacity: 0.4;
      margin-left: auto;
      max-width: 300px;
      text-align: right;
    }
    
    @media (max-width: 768px) {
      .full-menu { padding: 24px; }
      .full-menu-item-name { font-size: 28px; }
      .full-menu-item-desc { display: none; }
    }
    
    /* Channel pills */
    .channel-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 48px;
    }
    
    .channel-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 100px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .channel-pill:hover {
      background: rgba(255,255,255,0.15);
      transform: translateY(-2px);
    }
    
    .channel-pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    
    /* Main content */
    #app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }
    
    /* Hero section */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 120px 48px;
    }
    
    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(56px, 11vw, 160px);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -4px;
      margin-bottom: 24px;
    }
    
    .hero-title .outline {
      -webkit-text-stroke: 2px var(--white);
      color: transparent;
    }
    
    .hero-subtitle {
      font-size: 18px;
      opacity: 0.5;
      max-width: 450px;
      line-height: 1.6;
    }
    
    .scroll-hint {
      position: absolute;
      bottom: 48px;
      left: 48px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      opacity: 0.3;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .scroll-hint::before {
      content: '';
      width: 40px;
      height: 1px;
      background: currentColor;
    }
    
    /* Section styles */
    .section {
      min-height: 100vh;
      padding: 100px 48px;
      position: relative;
    }
    
    .section-header {
      margin-bottom: 56px;
    }
    
    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 4px;
      opacity: 0.4;
      margin-bottom: 12px;
    }
    
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(40px, 7vw, 100px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -2px;
    }
    
    .section-header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }
    
    .section-see-all {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.5;
      cursor: pointer;
      padding-bottom: 12px;
      transition: opacity 0.3s;
    }
    
    .section-see-all:hover { opacity: 1; }
    
    .section-know { background: linear-gradient(160deg, #1e3a8a 0%, #1e40af 50%, #2563eb 100%); }
    .section-watch { background: linear-gradient(160deg, #7f1d1d 0%, #991b1b 50%, #dc2626 100%); }
    .section-listen { background: linear-gradient(160deg, #14532d 0%, #166534 50%, #16a34a 100%); }
    
    /* Card grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    
    /* Cards */
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    
    .card:hover {
      transform: translateY(-8px) scale(1.02);
      background: rgba(255,255,255,0.12);
      box-shadow: 0 32px 64px rgba(0,0,0,0.3);
    }
    
    .card.featured {
      grid-column: span 2;
    }
    
    .card-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    
    .card.featured .card-image {
      height: 280px;
    }
    
    .card-body {
      padding: 24px;
    }
    
    .card-channel {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.5;
      margin-bottom: 12px;
    }
    
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    
    .card.featured .card-title {
      font-size: 32px;
    }
    
    .card-subtitle {
      font-size: 14px;
      opacity: 0.6;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    
    .card-meta {
      font-size: 12px;
      opacity: 0.4;
    }
    
    /* Report detail view */
    .report-view {
      padding: 140px 48px 80px;
      max-width: 800px;
      margin: 0 auto;
    }
    
    .report-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.5;
      margin-bottom: 48px;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    
    .report-back:hover { opacity: 1; }
    
    .report-back svg {
      width: 16px;
      height: 16px;
    }
    
    .report-channel {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 16px;
    }
    
    .report-channel.know { color: var(--know-color); }
    .report-channel.watch { color: var(--watch-color); }
    .report-channel.listen { color: var(--listen-color); }
    
    .report-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -2px;
      margin-bottom: 24px;
    }
    
    .report-subtitle {
      font-size: 22px;
      opacity: 0.6;
      line-height: 1.5;
      margin-bottom: 32px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
    }
    
    .report-meta {
      font-size: 13px;
      opacity: 0.4;
      margin-bottom: 48px;
      padding-bottom: 48px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .report-image {
      width: 100%;
      border-radius: 16px;
      margin-bottom: 48px;
    }
    
    .report-body {
      font-size: 19px;
      line-height: 1.8;
    }
    
    .report-body p {
      margin-bottom: 28px;
    }
    
    .report-body h2 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin: 56px 0 24px;
    }
    
    .report-body h3 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      margin: 40px 0 16px;
    }
    
    .report-body a {
      color: var(--accent);
      text-decoration: underline;
    }
    
    .report-body blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 24px;
      margin: 32px 0;
      font-style: italic;
      opacity: 0.8;
    }
    
    .report-body ul, .report-body ol {
      margin-bottom: 28px;
      padding-left: 24px;
    }
    
    .report-body li {
      margin-bottom: 8px;
    }
    
    .report-body strong {
      color: var(--accent);
    }
    
    /* YouTube embeds */
    .youtube-embed {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      margin: 32px 0;
      border-radius: 12px;
      overflow: hidden;
    }
    
    .youtube-embed iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    
    /* Sources */
    .report-sources {
      margin-top: 64px;
      padding-top: 32px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .report-sources h4, .report-related h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.4;
      margin-bottom: 16px;
    }
    
    .report-sources a {
      display: block;
      padding: 8px 0;
      opacity: 0.6;
      transition: opacity 0.3s;
    }
    
    .report-sources a:hover {
      opacity: 1;
      color: var(--accent);
    }
    
    /* Related articles */
    .report-related {
      margin-top: 64px;
      padding-top: 48px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .related-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 24px;
    }
    
    .related-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .related-card:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-4px);
    }
    
    .related-card-channel {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.5;
      margin-bottom: 8px;
    }
    
    .related-card-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
    }
    
    .related-card-meta {
      font-size: 12px;
      opacity: 0.4;
      margin-top: 12px;
    }
    
    @media (max-width: 768px) {
      .related-grid { grid-template-columns: 1fr; }
    }
    
    /* Channel view */
    .channel-view {
      padding: 140px 48px 80px;
    }
    
    .channel-header {
      margin-bottom: 64px;
    }
    
    .channel-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(48px, 8vw, 100px);
      font-weight: 900;
      letter-spacing: -3px;
      margin-bottom: 16px;
    }
    
    .channel-desc {
      font-size: 18px;
      opacity: 0.5;
      max-width: 500px;
    }
    
    /* Feed list */
    .feed-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 900px;
    }
    
    .feed-item {
      display: flex;
      gap: 32px;
      padding: 32px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .feed-item:hover {
      background: rgba(255,255,255,0.08);
      transform: translateX(8px);
    }
    
    .feed-item-image {
      width: 200px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      flex-shrink: 0;
    }
    
    .feed-item-content {
      flex: 1;
    }
    
    .feed-item-channel {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.4;
      margin-bottom: 8px;
    }
    
    .feed-item-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    
    .feed-item-subtitle {
      font-size: 15px;
      opacity: 0.5;
      line-height: 1.5;
    }
    
    .feed-item-meta {
      margin-top: 16px;
      font-size: 12px;
      opacity: 0.3;
    }
    
    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 18px;
      opacity: 0.5;
    }
    
    /* Responsive */
    @media (max-width: 1024px) {
      .card-grid { grid-template-columns: repeat(2, 1fr); }
      .card.featured { grid-column: span 2; }
    }
    
    @media (max-width: 768px) {
      nav { 
        padding: 16px 20px;
        background: rgba(10,10,10,0.95);
      }
      
      .logo { font-size: 24px; }
      
      .nav-links { display: none; }
      
      .hero {
        padding: 100px 20px 60px;
        min-height: auto;
      }
      
      .hero-title {
        font-size: 48px;
        letter-spacing: -2px;
      }
      
      .hero-subtitle {
        font-size: 16px;
      }
      
      .channel-pills {
        margin-top: 32px;
        gap: 8px;
      }
      
      .channel-pill {
        padding: 10px 16px;
        font-size: 13px;
      }
      
      .scroll-hint { display: none; }
      
      .section {
        padding: 60px 20px;
        min-height: auto;
      }
      
      .section-title {
        font-size: 36px;
        letter-spacing: -1px;
      }
      
      .section-header { margin-bottom: 32px; }
      
      .section-header-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      
      .section-see-all {
        padding-bottom: 0;
      }
      
      .card-grid { 
        grid-template-columns: 1fr;
        gap: 16px;
      }
      
      .card.featured { grid-column: span 1; }
      
      .card-image { height: 160px; }
      .card.featured .card-image { height: 200px; }
      
      .card-body { padding: 20px; }
      
      .card-title { font-size: 20px; }
      .card.featured .card-title { font-size: 24px; }
      
      /* Report view mobile */
      .report-view {
        padding: 100px 20px 60px;
      }
      
      .report-back { margin-bottom: 32px; }
      
      .report-title {
        font-size: 28px;
        letter-spacing: -1px;
      }
      
      .report-subtitle {
        font-size: 18px;
      }
      
      .report-body {
        font-size: 17px;
        line-height: 1.7;
      }
      
      .report-body h2 { font-size: 24px; }
      .report-body h3 { font-size: 20px; }
      
      /* Channel view mobile */
      .channel-view {
        padding: 100px 20px 60px;
      }
      
      .channel-title {
        font-size: 36px;
        letter-spacing: -1px;
      }
      
      .channel-desc {
        font-size: 16px;
      }
      
      .feed-item {
        flex-direction: column;
        padding: 20px;
        gap: 16px;
      }
      
      .feed-item-image {
        width: 100%;
        height: 160px;
      }
      
      .feed-item-title {
        font-size: 20px;
      }
      
      .feed-item-subtitle {
        font-size: 14px;
      }
    }
    
    /* Small phones */
    @media (max-width: 400px) {
      .hero-title { font-size: 40px; }
      .section-title { font-size: 28px; }
      .channel-title { font-size: 28px; }
      .report-title { font-size: 24px; }
      
      .channel-pill {
        padding: 8px 14px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  
  <nav>
    <div class="logo" onclick="navigate('home')">Feed</div>
    <button class="menu-btn" onclick="toggleMenu()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      Menu
    </button>
  </nav>
  
  <div class="full-menu" id="full-menu">
    <div class="full-menu-header">
      <div class="full-menu-logo">Feed</div>
      <button class="full-menu-close" onclick="toggleMenu()">×</button>
    </div>
    <div class="full-menu-section">
      <div class="full-menu-label">Channels</div>
      <div class="full-menu-channels" id="menu-channels"></div>
    </div>
  </div>
  
  <main id="app">
    <div class="loading">Loading...</div>
  </main>

  <script>
    // Three.js background
    const canvas = document.getElementById('bg-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    const shapes = [];
    const geometries = [
      new THREE.TorusGeometry(1, 0.3, 16, 50),
      new THREE.OctahedronGeometry(0.7),
      new THREE.IcosahedronGeometry(0.6),
      new THREE.TorusKnotGeometry(0.5, 0.15, 64, 8),
    ];
    
    for (let i = 0; i < 12; i++) {
      const geometry = geometries[Math.floor(Math.random() * geometries.length)];
      const material = new THREE.MeshBasicMaterial({ 
        color: [0x2563eb, 0xdc2626, 0x16a34a, 0xfbbf24][Math.floor(Math.random() * 4)],
        wireframe: true,
        transparent: true,
        opacity: 0.2
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(
        (Math.random() - 0.5) * 16,
        (Math.random() - 0.5) * 16,
        (Math.random() - 0.5) * 8 - 4
      );
      mesh.userData = {
        rotX: Math.random() * 0.005,
        rotY: Math.random() * 0.005,
        speed: Math.random() * 0.3 + 0.3,
        offset: Math.random() * Math.PI * 2
      };
      shapes.push(mesh);
      scene.add(mesh);
    }
    
    camera.position.z = 5;
    
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', e => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });
    
    function animate() {
      requestAnimationFrame(animate);
      shapes.forEach(s => {
        s.rotation.x += s.userData.rotX;
        s.rotation.y += s.userData.rotY;
        s.position.y += Math.sin(Date.now() * 0.001 * s.userData.speed + s.userData.offset) * 0.001;
      });
      camera.position.x += (mouseX * 0.3 - camera.position.x) * 0.03;
      camera.position.y += (-mouseY * 0.3 - camera.position.y) * 0.03;
      camera.lookAt(scene.position);
      renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // State
    let channels = [];
    let currentView = 'home';
    
    // Menu toggle
    function toggleMenu() {
      document.getElementById('full-menu').classList.toggle('open');
    }
    
    // API
    async function api(endpoint) {
      const res = await fetch(`/api${endpoint}`);
      return res.json();
    }
    
    // Helpers
    function formatDate(d) {
      const date = new Date(d);
      const diff = Date.now() - date;
      if (diff < 3600000) return 'Just now';
      if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    
    function processYouTube(html) {
      return html.replace(
        /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})[^\s]*/g,
        '<div class="youtube-embed"><iframe src="https://www.youtube.com/embed/$1" allowfullscreen></iframe></div>'
      );
    }
    
    // Navigation
    function navigate(view, param = null) {
      currentView = view;
      
      let url = '/';
      if (view === 'report') url = `/reports/${param}`;
      else if (view === 'channel') url = `/channel/${param}`;
      
      history.pushState({ view, param }, '', url);
      render(view, param);
    }
    
    window.addEventListener('popstate', e => {
      if (e.state) render(e.state.view, e.state.param);
      else render('home');
    });
    
    // Parse URL
    function parseUrl() {
      const path = window.location.pathname;
      if (path.startsWith('/reports/')) return { view: 'report', param: path.split('/')[2] };
      if (path.startsWith('/channel/')) return { view: 'channel', param: path.split('/')[2] };
      return { view: 'home', param: null };
    }
    
    // Render card
    function renderCard(item, featured = false) {
      const img = item.image_data || item.image_url;
      return `
        <article class="card ${featured ? 'featured' : ''}" onclick="navigate('report', '${item.id}')">
          ${img ? `<img class="card-image" src="${img}" alt="">` : ''}
          <div class="card-body">
            <div class="card-channel">${item.channel_name || ''}</div>
            <h3 class="card-title">${item.title}</h3>
            ${item.subtitle && featured ? `<p class="card-subtitle">${item.subtitle}</p>` : ''}
            <div class="card-meta">${formatDate(item.created_at)}</div>
          </div>
        </article>
      `;
    }
    
    // Render section
    function renderSection(id, label, title, items, cls, channelSlug = null) {
      if (!items?.length) return '';
      return `
        <section id="${id}" class="section ${cls}">
          <div class="section-header">
            <div class="section-label">${label}</div>
            <div class="section-header-row">
              <h2 class="section-title">${title}</h2>
              ${channelSlug ? `<span class="section-see-all" onclick="navigate('channel', '${channelSlug}')">See all →</span>` : ''}
            </div>
          </div>
          <div class="card-grid">
            ${items.map((item, i) => renderCard(item, i === 0)).join('')}
          </div>
        </section>
      `;
    }
    
    // Render home
    async function renderHome() {
      const [dashboard, channelList] = await Promise.all([api('/dashboard'), api('/channels')]);
      channels = channelList;
      
      document.getElementById('menu-channels').innerHTML = channels.map(c => 
        `<div class="full-menu-item" onclick="navigate('channel', '${c.slug}'); toggleMenu()">
          <span class="dot" style="background:${c.color}"></span>
          <span class="full-menu-item-name">${c.name}</span>
          <span class="full-menu-item-desc">${c.description || ''}</span>
        </div>`
      ).join('');
      
      const channelPills = channels.map(c => 
        `<div class="channel-pill" onclick="navigate('channel', '${c.slug}')">
          <span class="dot" style="background:${c.color}"></span>
          ${c.name}
        </div>`
      ).join('');
      
      document.getElementById('app').innerHTML = `
        <section class="hero">
          <h1 class="hero-title">
            Your<br><span class="outline">Briefing</span>
          </h1>
          <p class="hero-subtitle">AI-curated news across tech, business, music, and culture.</p>
          <div class="channel-pills">${channelPills}</div>
          <div class="scroll-hint">Scroll to explore</div>
        </section>
        ${renderSection('know', 'Stay Informed', 'Know', dashboard.know, 'section-know')}
        ${renderSection('watch', 'Start Watching', 'Watch', dashboard.watch, 'section-watch')}
        ${renderSection('listen', 'Start Listening', 'Listen', dashboard.listen, 'section-listen')}
      `;
    }
    
    // Render report
    async function renderReport(id) {
      const [report, allReports] = await Promise.all([
        api(`/reports/${id}`),
        api(`/feed?limit=50`)
      ]);
      
      const sectionClass = report.channel_slug === 'music' ? 'listen' : 
                          report.channel_slug === 'pop-culture' || report.channel_slug === 'anime' ? 'watch' : 'know';
      
      const content = processYouTube(marked.parse(report.content || ''));
      const img = report.image_data || report.image_url;
      const sources = report.sources || [];
      
      // Find related articles
      const currentEntities = report.key_entities || [];
      const related = allReports
        .filter(r => r.id !== parseInt(id))
        .map(r => {
          let score = 0;
          // Same channel = +2
          if (r.channel_id === report.channel_id) score += 2;
          // Shared entities = +1 each
          const rEntities = r.key_entities || [];
          currentEntities.forEach(e => {
            if (rEntities.some(re => re.toLowerCase() === e.toLowerCase())) score += 1;
          });
          return { ...r, score };
        })
        .filter(r => r.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 4);
      
      // More from this channel
      const moreFromChannel = allReports
        .filter(r => r.id !== parseInt(id) && r.channel_id === report.channel_id)
        .slice(0, 4);
      
      const relatedToShow = related.length >= 2 ? related : moreFromChannel;
      
      document.getElementById('app').innerHTML = `
        <article class="report-view">
          <div class="report-back" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back
          </div>
          <div class="report-channel ${sectionClass}">${report.channel_name}</div>
          <h1 class="report-title">${report.title}</h1>
          ${report.subtitle ? `<p class="report-subtitle">${report.subtitle}</p>` : ''}
          <div class="report-meta">${formatDate(report.created_at)} · ${report.read_time_min || 5} min read</div>
          ${img ? `<img class="report-image" src="${img}" alt="">` : ''}
          <div class="report-body">${content}</div>
          ${sources.length ? `
            <div class="report-sources">
              <h4>Sources</h4>
              ${sources.map(s => `<a href="${s.url}" target="_blank">${s.title || s.url}</a>`).join('')}
            </div>
          ` : ''}
          ${relatedToShow.length ? `
            <div class="report-related">
              <h4>More to Explore</h4>
              <div class="related-grid">
                ${relatedToShow.map(r => `
                  <div class="related-card" onclick="navigate('report', '${r.id}')">
                    <div class="related-card-channel" style="color: ${r.channel_color}">${r.channel_name}</div>
                    <div class="related-card-title">${r.title}</div>
                    <div class="related-card-meta">${formatDate(r.created_at)}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </article>
      `;
      window.scrollTo(0, 0);
    }
    
    // Render channel
    async function renderChannel(slug) {
      const [reports, channelList] = await Promise.all([
        api(`/feed?channel=${slug}`),
        channels.length ? Promise.resolve(channels) : api('/channels')
      ]);
      if (!channels.length) channels = channelList;
      
      const channel = channels.find(c => c.slug === slug) || { name: slug, description: '' };
      
      document.getElementById('app').innerHTML = `
        <div class="channel-view">
          <div class="channel-header">
            <h1 class="channel-title" style="color: ${channel.color}">${channel.name}</h1>
            <p class="channel-desc">${channel.description || ''}</p>
          </div>
          <div class="feed-list">
            ${reports.map(r => {
              const img = r.image_data || r.image_url;
              return `
                <div class="feed-item" onclick="navigate('report', '${r.id}')">
                  ${img ? `<img class="feed-item-image" src="${img}" alt="">` : ''}
                  <div class="feed-item-content">
                    <div class="feed-item-channel">${r.channel_name}</div>
                    <h3 class="feed-item-title">${r.title}</h3>
                    ${r.subtitle ? `<p class="feed-item-subtitle">${r.subtitle}</p>` : ''}
                    <div class="feed-item-meta">${formatDate(r.created_at)} · ${r.read_time_min || 5} min</div>
                  </div>
                </div>
              `;
            }).join('') || '<p style="opacity:0.5">No reports yet</p>'}
          </div>
        </div>
      `;
      window.scrollTo(0, 0);
    }
    
    // Main render
    function render(view, param) {
      if (view === 'report') renderReport(param);
      else if (view === 'channel') renderChannel(param);
      else renderHome();
    }
    
    // Init
    const { view, param } = parseUrl();
    render(view, param);
  </script>
</body>
</html>
