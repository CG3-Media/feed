<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --black: #0a0a0a;
      --white: #fafafa;
      --know-color: #2563eb;
      --watch-color: #dc2626;
      --listen-color: #16a34a;
      --accent: #fbbf24;
    }
    
    html { scroll-behavior: smooth; }
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--black);
      color: var(--white);
      overflow-x: hidden;
    }
    
    /* Three.js canvas */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    
    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 24px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      mix-blend-mode: difference;
    }
    
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    
    .nav-links {
      display: flex;
      gap: 32px;
    }
    
    .nav-links a {
      color: var(--white);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
      transition: opacity 0.3s;
    }
    
    .nav-links a:hover { opacity: 1; }
    
    /* Hero section */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 120px 48px;
      position: relative;
      z-index: 1;
    }
    
    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(64px, 12vw, 180px);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -4px;
      margin-bottom: 32px;
    }
    
    .hero-title span {
      display: block;
    }
    
    .hero-title .highlight {
      -webkit-text-stroke: 2px var(--white);
      color: transparent;
    }
    
    .hero-subtitle {
      font-size: 20px;
      opacity: 0.6;
      max-width: 500px;
      line-height: 1.6;
    }
    
    .scroll-indicator {
      position: absolute;
      bottom: 48px;
      left: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.5;
    }
    
    .scroll-indicator::before {
      content: '';
      width: 48px;
      height: 1px;
      background: var(--white);
    }
    
    /* Section styles */
    .section {
      min-height: 100vh;
      padding: 120px 48px;
      position: relative;
      z-index: 1;
    }
    
    .section-header {
      margin-bottom: 64px;
    }
    
    .section-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      opacity: 0.5;
      margin-bottom: 16px;
    }
    
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(48px, 8vw, 120px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -3px;
    }
    
    /* KNOW section - Blue */
    .section-know {
      background: linear-gradient(135deg, var(--know-color) 0%, #1e40af 100%);
    }
    
    /* WATCH section - Red */
    .section-watch {
      background: linear-gradient(135deg, var(--watch-color) 0%, #991b1b 100%);
    }
    
    /* LISTEN section - Green */
    .section-listen {
      background: linear-gradient(135deg, var(--listen-color) 0%, #166534 100%);
    }
    
    /* Card grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 32px;
    }
    
    /* 3D Card */
    .card-3d {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 32px;
      cursor: pointer;
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.5s;
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    
    .card-3d:hover {
      transform: translateY(-12px) rotateX(5deg);
      box-shadow: 0 40px 80px rgba(0,0,0,0.4);
    }
    
    .card-3d.featured {
      grid-column: span 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: center;
    }
    
    .card-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 24px;
    }
    
    .card-3d.featured .card-image {
      height: 300px;
      margin-bottom: 0;
    }
    
    .card-channel {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.7;
      margin-bottom: 12px;
    }
    
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    
    .card-3d.featured .card-title {
      font-size: 42px;
    }
    
    .card-subtitle {
      font-size: 16px;
      opacity: 0.7;
      line-height: 1.5;
    }
    
    .card-meta {
      margin-top: 24px;
      font-size: 13px;
      opacity: 0.5;
    }
    
    /* Parallax images */
    .parallax-image {
      position: absolute;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 32px 64px rgba(0,0,0,0.3);
    }
    
    .parallax-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* Floating elements */
    .float {
      animation: float 6s ease-in-out infinite;
    }
    
    .float-delayed {
      animation: float 6s ease-in-out infinite;
      animation-delay: -3s;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(2deg); }
    }
    
    /* Empty state */
    .empty-section {
      text-align: center;
      padding: 80px;
      opacity: 0.5;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      nav { padding: 16px 24px; }
      .hero, .section { padding: 80px 24px; }
      .card-3d.featured { grid-column: span 1; grid-template-columns: 1fr; }
      .card-grid { grid-template-columns: 1fr; }
    }
    
    /* Loading state */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 24px;
    }
    
    .loading::after {
      content: '';
      width: 24px;
      height: 24px;
      border: 2px solid var(--white);
      border-top-color: transparent;
      border-radius: 50%;
      margin-left: 16px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  
  <nav>
    <div class="logo">Feed</div>
    <div class="nav-links">
      <a href="#know">Know</a>
      <a href="#watch">Watch</a>
      <a href="#listen">Listen</a>
    </div>
  </nav>
  
  <main id="app">
    <div class="loading">Loading your briefing</div>
  </main>

  <script>
    // Three.js background
    const canvas = document.getElementById('bg-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    // Create floating geometric shapes
    const shapes = [];
    const geometries = [
      new THREE.TorusGeometry(1, 0.3, 16, 100),
      new THREE.OctahedronGeometry(0.8),
      new THREE.IcosahedronGeometry(0.7),
    ];
    
    for (let i = 0; i < 15; i++) {
      const geometry = geometries[Math.floor(Math.random() * geometries.length)];
      const material = new THREE.MeshBasicMaterial({ 
        color: [0x2563eb, 0xdc2626, 0x16a34a, 0xfbbf24][Math.floor(Math.random() * 4)],
        wireframe: true,
        transparent: true,
        opacity: 0.3
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(
        (Math.random() - 0.5) * 20,
        (Math.random() - 0.5) * 20,
        (Math.random() - 0.5) * 10 - 5
      );
      mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      mesh.userData = {
        rotationSpeed: { x: Math.random() * 0.01, y: Math.random() * 0.01 },
        floatSpeed: Math.random() * 0.5 + 0.5,
        floatOffset: Math.random() * Math.PI * 2
      };
      shapes.push(mesh);
      scene.add(mesh);
    }
    
    camera.position.z = 5;
    
    // Mouse tracking for parallax
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });
    
    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      
      shapes.forEach(shape => {
        shape.rotation.x += shape.userData.rotationSpeed.x;
        shape.rotation.y += shape.userData.rotationSpeed.y;
        shape.position.y += Math.sin(Date.now() * 0.001 * shape.userData.floatSpeed + shape.userData.floatOffset) * 0.002;
      });
      
      camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.05;
      camera.position.y += (-mouseY * 0.5 - camera.position.y) * 0.05;
      camera.lookAt(scene.position);
      
      renderer.render(scene, camera);
    }
    animate();
    
    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // API helper
    async function api(endpoint) {
      const res = await fetch(`/api${endpoint}`);
      return res.json();
    }
    
    // Format date
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diff = now - date;
      if (diff < 3600000) return 'Just now';
      if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    
    // Render card
    function renderCard(item, featured = false) {
      const hasImage = item.image_data || item.image_url;
      return `
        <article class="card-3d ${featured ? 'featured' : ''}" data-report-id="${item.id}">
          ${hasImage ? `<img class="card-image" src="${item.image_data || item.image_url}" alt="">` : ''}
          <div class="card-content">
            <div class="card-channel">${item.channel_name}</div>
            <h3 class="card-title">${item.title}</h3>
            ${item.subtitle ? `<p class="card-subtitle">${item.subtitle}</p>` : ''}
            <div class="card-meta">${formatDate(item.created_at)}</div>
          </div>
        </article>
      `;
    }
    
    // Render section
    function renderSection(id, label, title, items, colorClass) {
      if (!items || items.length === 0) return '';
      
      return `
        <section id="${id}" class="section ${colorClass}">
          <div class="section-header">
            <div class="section-label">${label}</div>
            <h2 class="section-title">${title}</h2>
          </div>
          <div class="card-grid">
            ${items.map((item, i) => renderCard(item, i === 0)).join('')}
          </div>
        </section>
      `;
    }
    
    // Load and render dashboard
    async function loadDashboard() {
      const dashboard = await api('/dashboard');
      const app = document.getElementById('app');
      
      app.innerHTML = `
        <section class="hero">
          <h1 class="hero-title">
            <span>Your</span>
            <span class="highlight">Briefing</span>
          </h1>
          <p class="hero-subtitle">
            AI-curated news across business, tech, music, and culture. 
            Updated ${dashboard.cached ? 'recently' : 'just now'}.
          </p>
          <div class="scroll-indicator">Scroll to explore</div>
        </section>
        
        ${renderSection('know', 'Stay Informed', 'Know', dashboard.know, 'section-know')}
        ${renderSection('watch', 'Start Watching', 'Watch', dashboard.watch, 'section-watch')}
        ${renderSection('listen', 'Start Listening', 'Listen', dashboard.listen, 'section-listen')}
      `;
      
      // Add click handlers
      document.querySelectorAll('.card-3d').forEach(card => {
        card.addEventListener('click', () => {
          window.location.href = `/reports/${card.dataset.reportId}`;
        });
      });
      
      // Parallax on scroll
      window.addEventListener('scroll', () => {
        const scrollY = window.scrollY;
        document.querySelectorAll('.section-title').forEach(el => {
          el.style.transform = `translateX(${scrollY * 0.1}px)`;
        });
      });
    }
    
    loadDashboard();
  </script>
</body>
</html>
